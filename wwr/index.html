<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index &mdash; White Washed Rafting Adventures</title>
  <meta name="description"
    content="Whitewater rafting is a type of recreation that involves navigating a non-motorized watercraft down free flowing rivers. This rafting company organizes trips, provides the watercraft, life jackets, etc., and offers experienced guides to take passengers down a river. The business intent is to provide a thrilling and safe experience to individuals and groups for a fee.">
  <meta name="author" content="Jesse Hamilton">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
  <header>
    <h1 class="index-heading">Home | White Washed Rafting Adventures</h1>
    <div class="brandbar">
      <div class="grid">
        <img src="images/logo.jpg" alt="White Washed Rafting Color Logo Image" width="200">
        <nav>
          <ul>
            <li><a href="index.html" target="_blank">Home</a></li>
            <li><a href="about.html" target="_blank">About Us</a></li>
            <li><a href="trips.html" target="_blank">Trips</a></li>
            <li><a href="contact.html" target="_blank">Contact Us</a></li>
          </ul>
        </nav>
      </div>
    </div>

  </header>
  <main>
    <div class="hero">
      <img src="images/index_hero.jpg" alt="Rafing Background Image for index page" width="800">
      <h1 class="index-hero-heading">🌊🌊🌊🌊 Come Raft With Us 🌊🌊🌊🌊</h1>
      <article>
        <h2>0</h2>
        <p class="hero-tagline">Water was never so wet!
        </p>
      </article>
    </div>
    <div class="action">
      <div class="rafting">
        <a href="trips.html" target="_blank"> <img src="images/raft-with-us.jpg"
            alt="raft with us image linked to trips">
        </a>
      </div>
      <div class="newsletter-wrapper">
        <form class="newsletter-form">
          <fieldset>
            <legend>Newsletter - Subcribe Here</legend>
            <div class="form-item column1">
              <label for="name">Name:</label>
              <input type="text" id="name" name="name" required placeholder="Name">
            </div>
            <div class="form-item column1">
              <label for="usermail">Email:</label>
              <input type="email" id="usermail" name="usermail" required
                placeholder="email@domain.com">
            </div>
            <div class="form-item column1">
              <label for="feedback">Message</label>
              <textarea id="feedback" name="feedback" rows="4"
                placeholder="Let us know about your interests."></textarea>
            </div>
            <button type="submit">Subscribe</button>
          </fieldset>
        </form>
      </div>
    </div>
    <div class="helps">
      <h2>Safety, Tips & Tricks, and Accessories</h2>
      <div class="helps-grid">
        <figure>
          <a href="safety.html" target="_blank"> <img src="images/safety.jpg"
              alt="rafting safety image" width="150"> </a>
          <figcaption>Safety</figcaption>
        </figure>
        <figure>
          <a href="tips.html" target="_blank"> <img src="images/tips.jpg" alt="rafting tips image"
              width="150">
          </a>
          <figcaption>Tips</figcaption>
        </figure>
        <figure>
          <a href="accessories.html" target="_blank"> <img src="images/accessories.jpg"
              alt="rafting accessories image" width="150">
          </a>
          <figcaption>Accessories</figcaption>
        </figure>
      </div>
    </div>

  </main>
  <footer>
    <p>&copy; 2026 | White Washed Rafting Adventures | Jesse Hamilton </p>
    <nav class="socialmedia">
      <a href="https://facebook.com" target="_blank">
        <img src="images/facebook.png" alt="Facebook Icon" width="75">
      </a>
      <a href="https://linkedin.com" target="_blank">
        <img src="images/linkedin.svg" alt="LinkedIn Icon" width="75">
      </a>
      <a href="https://instagram.com" target="_blank">
        <img src="images/instagram.svg" alt="Instagram Icon" width="75">
      </a>
    </nav>
  </footer>
</body>

</html>
