<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us &mdash; White Washed Rafting Adventures</title>
    <meta name="description"
      content="Contact information for the White Washed Rafting Adventures company.">
    <meta name="author" content="Jesse Hamilton">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <div class="brandbar">
            <div class="grid">
                <img src="images/logo.jpg" alt="White Washed Rafting Color Logo Image" width="200">
                <nav>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="about.html">About Us</a></li>
                        <li><a href="trips.html">Trips</a></li>
                        <li><a href="contact.html">Contact Us</a></li>
                    </ul>
                </nav>
            </div>
        </div>

    </header>
    <main>
        <h1 class="contact-heading">Contact Us | White Washed Rafting Adventures</h1>
        <div class="contacts">
            <address class="address">
                <strong>White Washed Rafting Adventures</strong><br>
                742 Ridgeway Dr<br>
                Page, AZ 86040<br>
                1-800-get-wetz<br>
                <a href="mailto:info@whitewashed.com">info@whitewashed.com</a>
            </address>
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d10043.464438173536!2d-111.47677450045077!3d36.93387731010475!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sus!4v1770087153214!5m2!1sen!2sus"
                  width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <div class="form">
                <form>
                    <fieldset>
                        <div class="form-item column1">
                            <label for="name">Name:</label>
                            <input type="text" id="name" name="name" required placeholder="Name">
                        </div>
                        <div class="form-item column1">
                            <label for="usermail">Email:</label>
                            <input type="email" id="usermail" name="usermail" required
                              placeholder="email@domain.com">
                        </div>
                        <div class="form-item column1 radio-group">
                            <label class="radio-option">
                                <input type="radio" name="purpose" value="general"> General
                                Inquiry</label>
                            <label class="radio-option">
                                <input type="radio" name="purpose" value="reservation">
                                Reservation
                                Question</label>
                            <label class="radio-option">
                                <input type="radio" name="purpose" value="website"> Website
                                Suggestion</label>
                        </div>

                        <div class="form-item column1">
                            <label for="feedback">Message</label>
                            <textarea id="feedback" name="feedback" rows="4"
                              placeholder="Let us know how we can help."></textarea>
                        </div>
                        <div class="form-item column1">
                            <label for="subscribe"> <input type="checkbox" id="subscribe"
                                  name="subscribe"> Please Subscribe me to the monthly
                                newsletter.</label>

                        </div>
                        <button type="submit">Get in Touch</button>
                    </fieldset>
                </form>
            </div>
        </div>
        <div class="gallery-employees">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-grid">
                <figure>
                    <img src="images/larryemp.jpg" alt="3 stooges Larry" width="150">
                    <figcaption>Larry</figcaption>
                </figure>
                <figure>
                    <img src="images/moeemp.jpg" alt="3 stooges Moe" width="150">
                    <figcaption>Moe</figcaption>
                </figure>
                <figure>
                    <img src="images/curlyemp.jpg" alt="3 stooges Curly" width="150">
                    <figcaption>Curley</figcaption>
                </figure>
            </div>
        </div>

    </main>
    <footer>
        <p>&copy; 2026 | White Washed Rafting Adventures | Jesse Hamilton </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon" width="75">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.svg" alt="LinkedIn Icon" width="75">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.svg" alt="Instagram Icon" width="75">
            </a>
        </nav>
    </footer>
</body>

</html>
