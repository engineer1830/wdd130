<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic HTLM & CSS Quiz Form</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <main>
        <h1>✅ Basic HTML & CSS Quiz</h1>
        <form>
            <fieldset>
                <legend></legend>
                <div class="form-item column1">
                    <label for="q1">1. What does the acronymn CSS stand for?</label>
                    <input type="text" id="q1" name="q1" required>
                </div>
                <div class="form-item column1">
                    <label for="q2">2. How are id and class attributes selected in
                        CSS?</label>
                    <textarea id="q2" name="q2" rows="4"
                      placeholder="Write your answers here!"></textarea>
                </div>
                <div class="form-item column1">
                    <label for="q3">3. Which one of the following is a valid CSS
                        comment?</label>
                    <select name="quantity" id="quantity">
                        <option value="" selected disabled>Choose One</option>
                        <option value="a">A.</option>
                        <option value="b">B.</option>
                        <option value="c">C.</option>
                    </select>
                </div>
                <div class="form-item column1">
                    <label for="q4">4. What is the bottom margin in this declaration?</label>
                    <code>margin: 10px 5px 15px;</code>
                    <input type="number" id="q4" name="q4" required>
                </div>
                <button type="submit">Submit Quiz</button>
            </fieldset>
</body>

</html>
